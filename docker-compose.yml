services:
  db:
    image: postgres:16
    container_name: local-postgres   # same name the assignment uses in its docker exec commands
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres    # local learning database only
      POSTGRES_DB: gradebook         # created automatically on first start
    ports:
      - "5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # every .sql file in this folder runs once, in alphabetical order, on the FIRST start
      - ./db/init:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
